name: Build NeonVisuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Validate JSON resources
        run: |
          python -m json.tool src/main/resources/fabric.mod.json > /dev/null
          python -m json.tool src/main/resources/neonvisuals.mixins.json > /dev/null

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NeonVisuals
          path: build/libs/*.jar

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: NeonVisuals build ${{ github.run_number }}
          files: build/libs/*.jar
          make_latest: true
